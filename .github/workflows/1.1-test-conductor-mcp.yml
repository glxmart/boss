name: 1.1 - Test conductor-mcp

on:
  pull_request:
    branches: [main]
    paths:
      - 'conductor-mcp/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/1.1-test-conductor-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'conductor-mcp/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/1.1-test-conductor-mcp.yml'

jobs:
  test:
    name: Test conductor-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Build (monorepo orchestrated)
        run: pnpm --filter @glxmart/conductor-mcp build

      - name: Test (monorepo orchestrated)
        run: pnpm --filter @glxmart/conductor-mcp test

      - name: Lint (monorepo orchestrated)
        run: pnpm --filter @glxmart/conductor-mcp lint

      - name: Format check (monorepo)
        run: pnpm format:check
