name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-cli:
    name: Test boss-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: cd boss-cli && pnpm build

      - name: Test
        run: cd boss-cli && pnpm test

      - name: Lint
        run: cd boss-cli && pnpm lint || echo "No lint script"

  test-conductor:
    name: Test conductor-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: cd conductor-mcp && pnpm build

      - name: Test
        run: cd conductor-mcp && pnpm test

      - name: Lint
        run: cd conductor-mcp && pnpm lint || echo "No lint script"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-cli, test-conductor]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm build

      - name: Run integration tests
        run: cd boss-cli && pnpm test:integration